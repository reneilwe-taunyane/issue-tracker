name: Deploy (Vercel Production)

# Deploys Team Zendor's fork (Zedu-Endor/issue-tracker) to Vercel production,
# only after CI has succeeded and the Malware Scan (CI Gate) passed on the same
# commit — the same gate the Coolify deploy waits for (#579).
#
# Vercel CLI is pinned to a major version so an upstream CLI release cannot
# change deploy semantics unannounced.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: vercel-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel (production)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' 
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Wait for Malware Scan (CI Gate)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          echo "Verifying Malware Scan (CI Gate) for commit $HEAD_SHA in $GH_REPO..."

          ELAPSED=0
          TIMEOUT=600
          while true; do
            STATUS=$(gh run list --repo "$GH_REPO" --commit "$HEAD_SHA" --branch main --event push --workflow "Malware Scan (CI Gate)" --json status,conclusion --jq '.[0] // empty')
            if [[ -n "$STATUS" ]]; then
              RUN_STATUS=$(echo "$STATUS" | jq -r '.status')
              RUN_CONCLUSION=$(echo "$STATUS" | jq -r '.conclusion')
              echo "Malware Scan status: $RUN_STATUS, conclusion: $RUN_CONCLUSION"

              if [[ "$RUN_STATUS" == "completed" ]]; then
                if [[ "$RUN_CONCLUSION" != "success" ]]; then
                  echo "Malware Scan (CI Gate) did not succeed (conclusion: $RUN_CONCLUSION). Aborting deployment."
                  exit 1
                fi
                echo "Malware Scan (CI Gate) succeeded!"
                break
              fi
            else
              echo "Waiting for Malware Scan (CI Gate) run to be registered..."
            fi

            if [[ $ELAPSED -ge $TIMEOUT ]]; then
              echo "Timed out waiting for Malware Scan (CI Gate)"
              exit 1
            fi

            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Vercel Secrets
        id: check-secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || \
             [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || \
             [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::warning::VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID must be configured in Settings -> Secrets and variables -> Actions. Skipping Vercel deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI (pinned major)
        if: steps.check-secrets.outputs.configured == 'true'
        run: npm install -g "vercel@48"

      - name: Pull Vercel Environment Information
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        if: steps.check-secrets.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
